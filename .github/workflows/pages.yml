name: Publish and verify Siyareh Koochooloo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Validate source
        run: |
          test -s index.html
          test -s print.html
          grep -q 'SITE_BUILD_VERSION' index.html
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published site responds
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SHA: ${{ github.sha }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fLsS --max-time 15 "${PAGE_URL}?version=${SHA}" -o /tmp/live-site.html; then
              if grep -q 'SITE_BUILD_VERSION' /tmp/live-site.html; then
                echo "Verified site is published at ${PAGE_URL}"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "Published site could not be verified" >&2
          exit 1
